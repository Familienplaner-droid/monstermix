<title>Potlings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte – Kopfzeile, Punkte, der Topf füllt den Rest, darunter Hilfen und die Monster-Reihenfolge. */
:root {
  --bg: #E6F5E4;          /* Monsterwiese */
  --bg-deep: #CDEBCB;
  --pot: #FFF9EC;         /* Topf-Inneres: Monsterwiese */
  --pot-wald: #EEF5E1; --pot-wolken: #F4EFFF; --pot-sturm: #ECE8F4;
  --pot-rim: #5B4A6B;     /* Topfwand */
  --card: #FFFFFF;
  --ink: #1D3A2C;
  --ink-soft: #4F6F5E;
  --accent: #7A4DE0;      /* Zauber-Violett für Knöpfe */
  --on-accent: #FFFFFF;
  --danger: #E8502A;
  --gold: #FFC93C; --on-gold: #3A2A00;
  --guide: rgba(29, 58, 44, .22);
  --shade: rgba(29, 58, 44, .16);
  --veil: rgba(255, 249, 236, .9);
  --pot-veil: rgba(255, 252, 244, .42);
  --silhouette: brightness(0);
  --font-display: "Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12211A; --bg-deep: #0D1913; --pot: #1B2A33; --pot-rim: #8E7AA6; --card: #1F382B;
    --pot-wald: #1A2C22; --pot-wolken: #231E33; --pot-sturm: #1E2130;
    --ink: #E7F5EA; --ink-soft: #A3C2B0; --accent: #A98BFF; --on-accent: #1B1038; --danger: #FF8A6B;
    --guide: rgba(231, 245, 234, .25); --shade: rgba(0, 0, 0, .4); --veil: rgba(27, 42, 51, .9); --pot-veil: rgba(12, 18, 24, .5);
    --silhouette: brightness(0) invert(1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12211A; --bg-deep: #0D1913; --pot: #1B2A33; --pot-rim: #8E7AA6; --card: #1F382B;
  --pot-wald: #1A2C22; --pot-wolken: #231E33; --pot-sturm: #1E2130;
  --ink: #E7F5EA; --ink-soft: #A3C2B0; --accent: #A98BFF; --on-accent: #1B1038; --danger: #FF8A6B;
  --guide: rgba(231, 245, 234, .25); --shade: rgba(0, 0, 0, .4); --veil: rgba(27, 42, 51, .9); --pot-veil: rgba(12, 18, 24, .5);
  --silhouette: brightness(0) invert(1);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
  display: flex; justify-content: center;
  overscroll-behavior: none;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0; text-wrap: balance; }

.app { position: relative; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }

.top { display: flex; align-items: center; gap: 8px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; line-height: 1; margin: 0 auto 0 0; letter-spacing: -.01em; }
.logo span:nth-child(odd) { color: #E8502A; }
.logo span:nth-child(even) { color: #2F86E8; }

.btn { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 10px 20px; font-weight: 800; min-height: 44px; box-shadow: 0 3px 0 var(--shade); }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.small { padding: 8px 16px; min-height: 40px; }
.btn.icon { padding: 0; width: 40px; min-height: 40px; display: grid; place-items: center; }
.btn.icon svg { width: 22px; height: 22px; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shade); }
.btn:disabled { opacity: .45; cursor: default; }
.btn[aria-pressed="true"].help { background: var(--accent); color: var(--on-accent); }

.bar { display: flex; align-items: center; gap: 16px; }
.stat .k { font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat.small b { font-size: 1.15rem; color: var(--ink-soft); line-height: 1.35; }
.bar .btn { margin-left: auto; }


.stage { flex: 1; min-height: 300px; display: flex; justify-content: center; align-items: flex-start; }
.pot { position: relative; max-width: 100%; border: 5px solid var(--pot-rim); border-top: 0; border-radius: 0 0 26px 26px; background: var(--pot); overflow: hidden; box-shadow: 0 4px 0 var(--shade); }
.pot[data-pot="wald"] { background: var(--pot-wald); }
.pot[data-pot="wolken"] { background: var(--pot-wolken); }
.pot[data-pot="sturm"] { background: var(--pot-sturm); }
.potline { align-self: center; display: flex; align-items: center; gap: 8px; max-width: 100%; min-height: 40px; padding: 4px 14px 4px 6px; border-radius: 999px; background: var(--bg-deep); color: var(--ink); font-weight: 800; }
.potline img { width: 30px; height: 30px; flex: none; }
.potline span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-display); font-size: 1.05rem; }
.potline svg { width: 18px; height: 18px; flex: none; color: var(--ink-soft); }
.card.potcard { width: 100%; text-align: left; font: inherit; color: inherit; border: 0; cursor: pointer; }
.card.potcard .pair { display: flex; flex: none; }
.card.potcard .pair img { width: 44px; height: 44px; }
.card.potcard .pair img + img { margin-left: -10px; }
.card.potcard[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
.card.potcard.locked { cursor: default; }
.card.potcard.locked .pair img { filter: var(--silhouette); opacity: .22; }
.card.potcard .tag { margin-left: auto; flex: none; font-size: .8rem; font-weight: 800; color: var(--ink-soft); }
.pot canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }

.toast { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--gold); color: var(--on-gold); border-radius: 999px; padding: 4px 16px 4px 6px; font-weight: 800; white-space: nowrap; max-width: calc(100% - 16px); pointer-events: none; box-shadow: 0 3px 0 var(--shade); animation: toast 2.6s ease-out forwards; }
.toast img { width: 40px; height: 40px; flex: none; }
.toast small { display: block; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.toast span { display: block; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -120%); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1.06); } 16% { transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 0); } }

.veil { position: absolute; inset: 0; background: var(--veil); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; animation: appear .25s ease-out; }
.veil p { margin: 0; color: var(--ink-soft); font-weight: 700; }
.veil .pts { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.veil .btn { margin-top: 10px; }
.veil .row-btns { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 10px; }
.veil .row-btns .btn { margin-top: 0; }
.btn.video { display: inline-flex; align-items: center; gap: 8px; }
.btn.video svg { width: 18px; height: 18px; flex: none; }
.veil .small { font-size: .85rem; max-width: 26ch; }
.veil .fail { color: var(--danger); }
.adsim { position: fixed; inset: 0; z-index: 50; background: #101418; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.adsim b { font-family: var(--font-display); font-size: 1.5rem; }
.adsim p { margin: 0; opacity: .8; max-width: 30ch; }
.adsim .count { font-family: var(--font-display); font-size: 3rem; font-variant-numeric: tabular-nums; }
.adsim .btn { background: #FFFFFF; color: #101418; }
@keyframes appear { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.helps { display: flex; gap: 8px; justify-content: center; }
.help { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; }
.help .n { background: var(--bg-deep); color: var(--ink); border-radius: 999px; min-width: 26px; height: 26px; padding: 0 6px; display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: .9rem; }

.chain { display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; }
.chain img { width: 24px; height: 24px; object-fit: contain; }
.chain .gap { width: 12px; }

.sheet { position: absolute; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; animation: appear .2s ease-out; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet p { margin: 0; color: var(--ink-soft); font-weight: 700; line-height: 1.4; }
.sheet h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin: 6px 0 -4px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 8px 14px 8px 8px; min-width: 0; }
.card img { width: 60px; height: 60px; flex: none; }
.card .who { min-width: 0; }
.card b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.2; }
.card span { display: block; color: var(--ink-soft); font-size: .9rem; font-weight: 700; line-height: 1.35; }
.card.unknown img { filter: var(--silhouette); opacity: .22; }
.card.unknown b { color: var(--ink-soft); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border-radius: 18px; padding: 10px 10px 10px 16px; font-weight: 800; }
.switch { display: flex; background: var(--bg-deep); border-radius: 999px; padding: 3px; }
.switch button { background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: .9rem; color: var(--ink-soft); min-height: 38px; }
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.sheet .btn.wide { align-self: flex-start; }

.story { z-index: 8; gap: 14px; overflow-x: hidden; }
.story .label { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.scene { position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; flex: none; box-shadow: 0 4px 0 var(--shade); background: var(--card); }
.scene > img.full { width: 100%; height: 100%; object-fit: cover; display: block; }
.scene .cast { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; gap: 2%; padding: 0 6% 9%; }
.scene .cast img { flex: 0 1 22%; min-width: 0; width: 22%; height: auto; }
.scene .cast img.big { flex-basis: 40%; width: 40%; }
.scene.storm .cast img { animation: whirl 2.4s ease-in-out infinite alternate; }
.scene.storm .cast img:nth-child(2n) { animation-delay: -1.2s; }
.scene.storm .cast { align-items: center; padding-bottom: 0; }
@keyframes whirl { from { transform: translateY(-14%) rotate(-25deg); } to { transform: translateY(12%) rotate(25deg); } }
.story .text { font-size: 1.12rem; line-height: 1.5; font-weight: 700; color: var(--ink); max-width: 34ch; text-wrap: pretty; }
.story .hint { font-weight: 800; color: var(--accent); margin: 0; }
.story .nav { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-bottom: 4px; }
.story .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-right: auto; min-width: 0; font-weight: 800; font-size: .85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.story .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-deep); }
.story .dots i.on { background: var(--accent); }
.btn.link { background: transparent; box-shadow: none; color: var(--ink-soft); padding: 10px 12px; }
.btn.wide2 { align-self: stretch; }
@media (prefers-reduced-motion: reduce) { .veil, .sheet { animation: none; } .scene.storm .cast img { animation: none; } .toast { animation-timing-function: step-end; } }
</style>

<div class="app">
  <div class="top">
    <h1 class="logo" aria-label="Potlings"><span>Pot</span><span>lings</span></h1>
    <button class="btn ghost small" id="open-album" type="button" data-t="album"></button>
    <button class="btn ghost icon" id="open-settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>
    </button>
  </div>

  <div class="bar">
    <div class="stat"><div class="k" data-t="score"></div><b id="score">0</b></div>
    <div class="stat small"><div class="k" data-t="best"></div><b id="best">0</b></div>
    <button class="btn ghost small" id="restart" type="button" data-t="restart"></button>
  </div>

  <button class="potline" id="open-pots" type="button"><img alt="" id="pot-icon"><span id="pot-name"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>

  <div class="stage" id="stage">
    <div class="pot" id="pot"><canvas id="canvas" tabindex="0"></canvas></div>
  </div>

  <div class="helps">
    <button class="btn ghost help" id="help-transform" type="button" aria-pressed="false"><span data-t="transform"></span><span class="n" id="n-transform">0</span></button>
    <button class="btn ghost help" id="help-shake" type="button"><span data-t="shake"></span><span class="n" id="n-shake">1</span></button>
  </div>

  <div class="chain" id="chain" role="img"></div>

  <div class="sheet" id="sheet-album" hidden>
    <div class="sheet-head"><h2 data-t="album"></h2><button class="btn small" type="button" data-close data-t="close"></button></div>
    <p id="album-count"></p>
    <div id="album-list"></div>
  </div>

  <div class="sheet" id="sheet-pots" hidden>
    <div class="sheet-head"><h2 data-t="pots"></h2><button class="btn small" type="button" data-close data-t="close"></button></div>
    <p data-t="potsInfo"></p>
    <div class="cards" id="pot-list"></div>
    <button class="btn ghost wide2" id="replay-story" type="button" data-t="replayStory"></button>
  </div>

  <div class="sheet story" id="sheet-story" hidden role="dialog" aria-modal="true" aria-labelledby="story-label">
    <div class="label" id="story-label"></div>
    <div class="scene" id="story-scene"></div>
    <p class="text" id="story-text"></p>
    <p class="hint" id="story-hint" hidden></p>
    <div class="nav">
      <div class="dots" id="story-dots"></div>
      <button class="btn link" id="story-skip" type="button" data-t="skip"></button>
      <button class="btn" id="story-next" type="button"></button>
    </div>
  </div>

  <div class="sheet" id="sheet-settings" hidden>
    <div class="sheet-head"><h2 data-t="settings"></h2><button class="btn small" type="button" data-close data-t="close"></button></div>
    <div class="row"><span data-t="sfx"></span><div class="switch" data-set="sfx"><button id="sfx-on" type="button" data-v="1" data-t="on"></button><button id="sfx-off" type="button" data-v="0" data-t="off"></button></div></div>
    <div class="row"><span data-t="music"></span><div class="switch" data-set="music"><button id="music-on" type="button" data-v="1" data-t="on"></button><button id="music-off" type="button" data-v="0" data-t="off"></button></div></div>
    <div class="row"><span data-t="language"></span><div class="switch" data-set="lang"><button id="lang-de" type="button" data-v="de">Deutsch</button><button id="lang-en" type="button" data-v="en">English</button></div></div>
    <div class="row" id="privacy-row" hidden><span data-t="privacyAds"></span><button class="btn small" id="privacy-ads" type="button" data-t="change"></button></div>
    <p data-t="resetInfo"></p>
    <button class="btn ghost wide" id="reset" type="button"></button>
  </div>
</div>

        handles.push(AdMob.addListener('onRewardedVideoAdReward', () => { rewarded = true; }));

        handles.push(AdMob.addListener('onRewardedVideoAdFailedToShow', () => finish('fail')));

      const age = now - (born.get(m.id) || -1e9);
      const k = age < 240 ? 1 + .24 * Math.sin(Math.PI * age / 240) : 1;   // kurzes Hüpfen beim Verschmelzen
      if (mode === 'transform') {                                           // antippbare Monster leuchten leicht
        ctx.strokeStyle = colors.accent; ctx.lineWidth = 3; ctx.globalAlpha = .5 + .3 * Math.sin(now / 180);
        ctx.beginPath(); ctx.arc(m.body.position.x, m.body.position.y, m.r + 2, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
      }
      drawMonster(m.family, m.stage, m.body.position.x, m.body.position.y, m.r, m.body.angle, k, 1, blinking(m.id, now) || age < 240);
    }

    effects = effects.filter(e => now - e.t0 < e.life);
    for (const e of effects) {
      if (now < e.t0) continue;
      const p = (now - e.t0) / e.life;
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = e.color; ctx.fillStyle = e.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1 + p * .7), 0, 7); ctx.stroke();
      for (let i = 0; i < e.n; i++) {
        const a = i / e.n * Math.PI * 2 + e.spin, d = e.r * (1 + p * 1.6);
        ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, 3.5 * (1 - p) + 1, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    if (game.drops === 0 && mode !== 'transform') {
      ctx.fillStyle = colors['ink-soft']; ctx.textAlign = 'center';
      ctx.font = '800 17px Nunito, system-ui, sans-serif';
      ctx.fillText(t().hint1, G.W / 2, 250); ctx.fillText(t().hint2, G.W / 2, 274);
      ctx.font = '700 15px Nunito, system-ui, sans-serif'; ctx.fillText(t().hint3, G.W / 2, 306);
    }
  }
  const burst = (x, y, r, color, now, life, n) => effects.push({ x, y, r, color, t0: now, life: life || 380, n: n || 8, spin: Math.random() * 6 });

  // ---------- Album ----------
  function toast(src, small, text) {
    const old = pot.querySelector('.toast'); if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<img alt="" src="${src}"><div><small>${small}</small><span>${text}</span></div>`;
    pot.appendChild(el);
    setTimeout(() => el.remove(), 2700);
  }
  function discover(family, stage) {
    const key = family + stage;
    if (album.includes(key)) return;
    album.push(key); store.set('album', album);
    const bonus = album.length % 3 === 0;
    if (bonus) { transforms++; store.set('transforms', transforms); renderHelps(); }
    toast(SPRITE[key].src, t().found + (bonus ? ' · ' + t().bonus : ''), nameOf(family, stage));
    sfx.found();
  }
  function renderAlbum() {
    const n = album.length;
    $('album-count').textContent = t().albumCount(n, FAMILIES.length * 6, 3 - n % 3);
    $('album-list').innerHTML = FAMILIES.map(f => `<h3>${t().fam[f]}</h3><div class="cards">` + [1, 2, 3, 4, 5, 6].map(s => {
      const known = album.includes(f + s);
      return `<div class="card${known ? '' : ' unknown'}"><img alt="" src="${SPRITE[f + s].src}"><div class="who"><b>${known ? nameOf(f, s) : t().unknown}</b><span>${known ? t().lore[f][s - 1] : t().unknownText}</span></div></div>`;
    }).join('') + '</div>').join('');
  }

  // ---------- Spielschleife ----------
  let last = 0, acc = 0, lastSave = 0;
  function frame(now) {
    const dt = Math.min(100, now - (last || now)); last = now;
    if (!paused) acc += dt;
    while (acc >= G.STEP) {
      acc -= G.STEP;
      for (const e of game.step()) {
        if (e.type === 'drop') { sfx.drop(); discover(e.family, e.stage); }
        else if (e.type === 'merge') {
          born.set(e.id, now); burst(e.x, e.y, G.RADII[e.stage], PAL[e.family].l, now);
          sfx.merge(e.stage); discover(e.family, e.stage);
        } else if (e.type === 'fireworks') {
          for (let i = 0; i < 5; i++) burst(e.x + (Math.random() - .5) * 140, e.y + (Math.random() - .5) * 140, 30 + Math.random() * 40, i % 2 ? '#FFC93C' : PAL[e.family].c, now + i * 90, 700, 12);
          sfx.fireworks();
        } else if (e.type === 'transform') { born.set(e.id, now); burst(e.x, e.y, G.RADII[e.stage], colors.accent, now, 450, 10); sfx.transform(); }
        else if (e.type === 'shake') sfx.shake();
        else if (e.type === 'revive') { for (const r of e.removed) burst(r.x, r.y, r.r, PAL[r.family] ? PAL[r.family].l : colors.accent, now, 500, 10); sfx.fireworks(); }
        else if (e.type === 'over') { sfx.over(); store.del('game.' + potId); setMode(null); overNote = ''; showOver(); }
      }
    }
    if (game.score !== shownScore) {
      shownScore = game.score; $('score').textContent = shownScore;
      if (shownScore > best) { setBest(shownScore); }
    }
    if (now - lastSave > 2000) { lastSave = now; saveGame(); }
    draw(now);
    requestAnimationFrame(frame);
  }

  function snapshot() {
    return { score: game.score, drops: game.drops, current: game.current, shakesLeft, revivesLeft,
      monsters: [...game.monsters.values()].map(m => ({ family: m.family, stage: m.stage, x: Math.round(m.body.position.x * 10) / 10, y: Math.round(m.body.position.y * 10) / 10, angle: Math.round(m.body.angle * 100) / 100 })) };
  }
  function saveGame() { if (game && !game.over && game.drops > 0) store.set('game.' + potId, snapshot()); }
  // ---------- Geschichte ----------
  // Bilder: assets/story/*.webp (Szenen) und assets/backgrounds/*.webp (Töpfe), beim Bauen eingebettet.
  // Fehlt ein Bild, zeigt die Szene die beteiligten Monster vor einem Farbverlauf.
  const STORY_ART = /*__STORY__*/{};
  const POT_ART = /*__BG__*/{};
  const SCENES = {
    prolog1: { cast: ['fire1', 'water1', 'earth1', 'air1', 'fire2', 'water2'], bg: 'linear-gradient(#BFE6FF, #E6F5E4 55%, #9FD69B)' },
    prolog2: { cast: ['fire1', 'water1', 'earth1', 'air1'], bg: 'linear-gradient(#2C2350, #4B3B78 60%, #2E3D2E)', storm: true },
    kapitel1: { cast: ['fire1', 'water1'], bg: 'linear-gradient(#FFE6B8, #E6F5E4 55%, #A9D9A0)' },
    kapitel2: { cast: ['earth1', 'water1'], bg: 'linear-gradient(#CFE6B5, #EEF5E1 50%, #8DB878)' },
    kapitel3: { cast: ['fire1', 'air1'], bg: 'linear-gradient(#FFC9D9, #F4EFFF 55%, #FFFFFF)' },
    kapitel4: { cast: ['earth1', 'air1'], bg: 'linear-gradient(#5B4F7A, #8C7FA8 50%, #8A6A4E)' },
    epilog: { cast: ['earth1', 'air5', 'air1'], big: 'air5', bg: 'linear-gradient(#9FD3FF, #F4EFFF 55%, #A9D9A0)' },
  };
  // Kapitel: Seiten mit Szene, Text und Überschrift
  const CHAPTERS = {
    intro: [['prolog', 'prolog1', 'p1'], ['prolog', 'prolog2', 'p2'], ['wiese', 'kapitel1', 'k1a'], ['wiese', 'kapitel1', 'k1b']],
    wald: [['wald', 'kapitel2', 'k2a'], ['wald', 'kapitel2', 'k2b']],
    wolken: [['wolken', 'kapitel3', 'k3a'], ['wolken', 'kapitel3', 'k3b']],
    sturm: [['sturm', 'kapitel4', 'k4a'], ['sturm', 'kapitel4', 'k4b']],
    ende: [['ende', 'epilog', 'e1'], ['ende', 'epilog', 'e2'], ['ende', 'epilog', 'e3']],
  };
  const CHAPTER_ORDER = ['intro', 'wald', 'wolken', 'sturm', 'ende'];
  let seenStory = [], storyQueue = [], storyPage = 0;

  function playStory(ids) {
    storyQueue = ids.flatMap(id => CHAPTERS[id].map(page => ({ id, page })));
    if (!storyQueue.length) return;
    for (const id of ids) if (!seenStory.includes(id)) seenStory.push(id);
    store.set('story', seenStory);
    storyPage = 0; paused = true; setMode(null);
    $('sheet-story').hidden = false;
    renderStory();
    $('story-next').focus();
  }
  function renderScene(name) {
    const el = $('story-scene'), sc = SCENES[name];
    el.className = 'scene' + (!STORY_ART[name] && sc.storm ? ' storm' : '');
    if (STORY_ART[name]) { el.style.background = ''; el.innerHTML = `<img class="full" alt="" src="${STORY_ART[name]}">`; return; }
    el.style.background = sc.bg;
    el.innerHTML = `<div class="cast">${sc.cast.map(k => `<img alt="" src="${SPRITE[k].src}"${k === sc.big ? ' class="big"' : ''}>`).join('')}</div>`;
  }
  function renderStory() {
    const { id, page } = storyQueue[storyPage], [chap, scene, textKey] = page;
    const last = storyPage === storyQueue.length - 1;
    const lastOfChapter = last || storyQueue[storyPage + 1].id !== id;
    $('story-label').textContent = t().chapter[chap];
    renderScene(scene);
    $('story-text').textContent = t().story[textKey];
    const hint = lastOfChapter && id !== 'ende' ? (id === 'sturm' ? t().hintEnd(UNLOCK) : t().hintNext(UNLOCK)) : '';
    $('story-hint').textContent = hint; $('story-hint').hidden = !hint;
    $('story-next').textContent = last ? (id === 'ende' ? t().theEnd : t().go) : t().next;
    $('story-skip').hidden = last;
    $('story-dots').innerHTML = storyQueue.length > 6 ? `${storyPage + 1} / ${storyQueue.length}`
      : storyQueue.map((_, i) => `<i${i === storyPage ? ' class="on"' : ''}></i>`).join('');
  }
  function closeStory() { $('sheet-story').hidden = true; storyQueue = []; paused = false; }
  $('story-next').addEventListener('click', () => { wakeAudio(); if (storyPage < storyQueue.length - 1) { storyPage++; renderStory(); } else closeStory(); });
  $('story-skip').addEventListener('click', closeStory);
  $('replay-story').addEventListener('click', () => {
    $('sheet-pots').hidden = true;
    playStory(CHAPTER_ORDER.filter(id => seenStory.includes(id)));
  });

  function setBest(n) {
    const i = POTS.findIndex(p => p.id === potId);
    const wasOpen = i + 1 < POTS.length && potUnlocked(i + 1);
    best = n; bests[potId] = n; store.set('bests', bests); $('best').textContent = best;
    if (i + 1 < POTS.length && !wasOpen && potUnlocked(i + 1)) {
      const next = POTS[i + 1];
      toast(SPRITE[next.families[0] + '1'].src, t().potUnlocked, t().potNames[next.id]); sfx.found();
    }
    if (potId === 'sturm' && n >= UNLOCK && !seenStory.includes('ende')) { sfx.fireworks(); setTimeout(() => playStory(['ende']), 900); }
  }

  const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" fill="currentColor" opacity=".25"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>';
  let adBusy = false, overNote = '';
  function showOver() {
    hideOver();
    const veil = document.createElement('div');
    veil.className = 'veil';
    const canRevive = revivesLeft > 0;
    veil.innerHTML = `<h2>${t().over}</h2><div class="pts">${game.score}</div><p>${game.score > bestAtStart && game.score > 0 ? t().newBest : t().points}</p>
      <div class="row-btns">
        ${canRevive ? `<button class="btn video" type="button" id="revive">${PLAY_ICON}<span>${t().revive}</span></button><p class="small">${t().reviveHint}</p>` : ''}
        <button class="btn${canRevive ? ' ghost' : ''}" type="button" id="again">${t().again}</button>
        ${overNote ? `<p class="small fail">${overNote}</p>` : ''}
      </div>`;
    pot.appendChild(veil);
    $('again').addEventListener('click', () => { wakeAudio(); newGame(); });
    if (canRevive) $('revive').addEventListener('click', async () => {
      if (adBusy) return; adBusy = true; $('revive').disabled = true;
      const result = await Ads.show();
      adBusy = false;
      if (result === 'reward' && game.revive()) { revivesLeft--; overNote = ''; hideOver(); saveGame(); return; }
      overNote = result === 'cancel' ? t().adNoReward : t().adFail;
      showOver();
    });
  }
  function hideOver() { const v = pot.querySelector('.veil'); if (v) v.remove(); }

  function newGame(saved) {
    hideOver(); store.del('game.' + potId);
    game = G.create(Matter, { families: potOf(potId).families });
    born = new Map(); effects = []; shownScore = -1; aimX = G.W / 2; shakesLeft = 1; revivesLeft = 1; overNote = ''; mode = null;
    bestAtStart = best;
    if (saved && Array.isArray(saved.monsters)) {
      const fams = potOf(potId).families;
      for (const m of saved.monsters) if (fams.includes(m.family) && G.RADII[m.stage]) game.add(m.family, m.stage, m.x, m.y, m.angle || 0);
      game.score = saved.score || 0; game.drops = saved.drops || 0;
      if (saved.current && fams.includes(saved.current.family)) game.current = saved.current;
      shakesLeft = saved.shakesLeft === 0 ? 0 : 1;
      revivesLeft = saved.revivesLeft === 0 ? 0 : 1;
    }
    renderHelps();
  }

  // ---------- Hilfen ----------
  function setMode(m) { mode = m; $('help-transform').setAttribute('aria-pressed', String(m === 'transform')); }
  function renderHelps() {
    $('n-transform').textContent = transforms; $('n-shake').textContent = shakesLeft;
    $('help-transform').disabled = transforms < 1; $('help-shake').disabled = shakesLeft < 1;
  }
  $('help-transform').addEventListener('click', () => { wakeAudio(); if (game.over || !game.monsters.size) return; setMode(mode === 'transform' ? null : 'transform'); });
  $('help-shake').addEventListener('click', () => {
    wakeAudio(); setMode(null);
    if (shakesLeft > 0 && game.shake()) { shakesLeft--; renderHelps(); }
  });

  // ---------- Steuerung: Finger/Maus ziehen und loslassen, oder Pfeiltasten + Leertaste ----------
  function toWorld(e) { const b = canvas.getBoundingClientRect(); return { x: (e.clientX - b.left) / b.width * G.W, y: (e.clientY - b.top) / b.height * G.H }; }
  canvas.addEventListener('pointerdown', e => {
    wakeAudio();
    if (mode === 'transform') return;
    aiming = true; aimX = toWorld(e).x;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* nicht nötig */ }
  });
  canvas.addEventListener('pointermove', e => { if (aiming || e.pointerType === 'mouse') aimX = toWorld(e).x; });
  canvas.addEventListener('pointerup', e => {
    const p = toWorld(e);
    if (mode === 'transform') {
      const m = game.monsterAt(p.x, p.y);
      if (m && transforms > 0 && game.transform(m.id)) { transforms--; store.set('transforms', transforms); renderHelps(); setMode(null); }
      return;
    }
    if (!aiming) return;
    aiming = false; aimX = p.x; game.drop(aimX);
  });
  canvas.addEventListener('pointercancel', () => { aiming = false; });
  window.addEventListener('keydown', e => {
    if (paused || (e.target.closest && e.target.closest('button'))) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') { aimX = Math.max(0, aimX - 14); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { aimX = Math.min(G.W, aimX + 14); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') { wakeAudio(); if (mode !== 'transform') game.drop(aimX); e.preventDefault(); }
  });
  $('restart').addEventListener('click', () => { wakeAudio(); newGame(); });

  // ---------- Album- und Einstellungs-Fenster ----------
  function openSheet(id) { paused = true; setMode(null); resetArmed(false); if (id === 'sheet-album') renderAlbum(); $('privacy-row').hidden = !Ads.privacyAvailable(); $(id).hidden = false; $(id).scrollTop = 0; }
  $('privacy-ads').addEventListener('click', () => { Ads.privacyForm().catch(() => {}); });
  $('open-album').addEventListener('click', () => { wakeAudio(); openSheet('sheet-album'); });
  $('open-pots').addEventListener('click', () => { wakeAudio(); renderPots(); openSheet('sheet-pots'); });
  function renderPots() {
    $('pot-list').innerHTML = POTS.map((p, i) => {
      const open = potUnlocked(i), cur = p.id === potId;
      const tag = cur ? t().potNow : open ? t().potBest(bests[p.id] || 0) : '';
      const sub = open ? p.families.map(f => t().fam[f]).join(' + ') : t().potLocked(UNLOCK, t().potNames[POTS[i - 1].id]);
      return `<button class="card potcard${open ? '' : ' locked'}" type="button" id="pot-${p.id}" data-pot="${p.id}"${cur ? ' aria-current="true"' : ''}${open ? '' : ' aria-disabled="true"'}>
        <span class="pair">${p.families.map(f => `<img alt="" src="${SPRITE[f + '1'].src}">`).join('')}</span>
        <span class="who"><b>${t().potNames[p.id]}</b><span>${sub}</span></span><span class="tag">${tag}</span></button>`;
    }).join('');
    $('pot-list').querySelectorAll('.potcard').forEach(b => b.addEventListener('click', () => {
      const i = POTS.findIndex(p => p.id === b.dataset.pot);
      if (!potUnlocked(i)) return;
      if (POTS[i].id !== potId) switchPot(POTS[i].id);
      $('sheet-pots').hidden = true; paused = false;
    }));
  }
  function switchPot(id) {
    saveGame();
    potId = id; store.set('pot', potId);
    best = bests[potId] || 0; $('best').textContent = best;
    pot.dataset.pot = potId;
    newGame(store.get('game.' + potId, null));
    renderPotUI();
    if (CHAPTERS[potId] && !seenStory.includes(potId)) playStory([potId]);
  }
  function renderPotUI() {
    const p = potOf(potId);
    pot.style.backgroundImage = POT_ART[p.id] ? `linear-gradient(var(--pot-veil), var(--pot-veil)), url(${POT_ART[p.id]})` : '';
    pot.style.backgroundSize = POT_ART[p.id] ? 'cover' : ''; pot.style.backgroundPosition = POT_ART[p.id] ? 'center' : '';
    $('pot-icon').src = SPRITE[p.families[0] + '1'].src;
    $('pot-name').textContent = t().potNames[p.id];
    $('open-pots').setAttribute('aria-label', t().pots + ': ' + t().potNames[p.id]);
    const chain = $('chain'); chain.innerHTML = '';
    p.families.forEach((f, i) => {
      if (i) { const gap = document.createElement('span'); gap.className = 'gap'; chain.appendChild(gap); }
      for (let s = 1; s <= 6; s++) { const img = document.createElement('img'); img.src = SPRITE[f + s].src; img.alt = ''; chain.appendChild(img); }
    });
    chain.setAttribute('aria-label', t().chainIntro + p.families.map(f => t().chainOf(t().fam[f], nameOf(f, 1), nameOf(f, 6))).join(', '));
  }
  $('open-settings').addEventListener('click', () => { wakeAudio(); openSheet('sheet-settings'); });
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { b.closest('.sheet').hidden = true; paused = false; }));
  document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => {
    wakeAudio();
    const what = b.parentElement.dataset.set;
    if (what === 'lang') { lang = b.dataset.v; store.set('lang', lang); }
    else { sound[what] = b.dataset.v === '1'; store.set('sound', sound); applySound(); }
    renderTexts();
  }));
  let armed = false;
  function resetArmed(v) { armed = v; $('reset').textContent = v ? t().resetSure : t().reset; }
  $('reset').addEventListener('click', () => {
    if (!armed) { resetArmed(true); return; }
    store.keys().filter(k => k !== 'lang' && k !== 'sound').forEach(k => store.del(k));
    best = 0; bests = {}; album = []; transforms = 0; seenStory = []; $('best').textContent = 0;
    potId = 'wiese'; pot.dataset.pot = potId;
    newGame(); renderPotUI(); resetArmed(false);
    $('sheet-settings').hidden = true; paused = false;
  });

  function renderTexts() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t()[el.dataset.t]; });
    document.querySelectorAll('.switch').forEach(sw => {
      const cur = sw.dataset.set === 'lang' ? lang : (sound[sw.dataset.set] ? '1' : '0');
      sw.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cur)));
    });
    renderPotUI();
    if (!$('sheet-pots').hidden) renderPots();
    if (!$('sheet-story').hidden && storyQueue.length) renderStory();
    canvas.setAttribute('aria-label', t().pot);
    $('open-settings').setAttribute('aria-label', t().settings);
    resetArmed(armed);
    if (!$('sheet-album').hidden) renderAlbum();
    if (game && game.over) showOver();
  }

  // ---------- Start ----------
  function start(data) {
    lang = data.lang || store.get('lang', (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en');
    if (!TEXT[lang]) lang = 'de';
    const b = store.get('bests', null);
    bests = b && typeof b === 'object' ? b : {};
    const oldBest = +store.get('best', 0) || 0;                  // alter Bestwert (nur ein Topf) übernehmen
    if (oldBest && !bests.wiese) { bests.wiese = oldBest; store.set('bests', bests); }
    const oldGame = store.get('game', null);
    if (oldGame && !store.get('game.wiese', null)) store.set('game.wiese', oldGame);
    store.del('best'); store.del('game');
    potId = store.get('pot', 'wiese');
    if (POTS.findIndex(p => p.id === potId) < 0 || !potUnlocked(POTS.findIndex(p => p.id === potId))) potId = 'wiese';
    pot.dataset.pot = potId;
    best = bests[potId] || 0; $('best').textContent = best;
    const a = store.get('album', []); album = Array.isArray(a) ? a.filter(k => SPRITE[k]) : [];
    transforms = Math.max(0, +store.get('transforms', 0) || 0);
    const snd = store.get('sound', null); if (snd && typeof snd === 'object') sound = { sfx: snd.sfx !== false, music: snd.music !== false };
    newGame(data.game || store.get('game.' + potId, null));
    renderTexts(); readColors(); resize();
    new ResizeObserver(resize).observe($('stage'));
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
    new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    requestAnimationFrame(frame);
    Ads.preload();
    const st = store.get('story', []); seenStory = Array.isArray(st) ? st.filter(id => CHAPTERS[id]) : [];
    if (!seenStory.includes('intro')) playStory(['intro']);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => { saveGame(); return { lang }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
