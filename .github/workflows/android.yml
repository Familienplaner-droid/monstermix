# Baut bei jeder Änderung automatisch eine Testversion der Android-App (APK)
# und legt sie unter "Releases" zum Herunterladen ab.
name: Android-Testversion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-testversion
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Spielregeln testen
        run: npm test

      - name: Spiel bauen und ins Android-Projekt kopieren
        run: |
          node build.js
          npx cap sync android

      - name: Android-App bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Potlings-Testversion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Potlings-Testversion
          path: Potlings-Testversion.apk

      - name: Als Testversion veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete testversion --yes --cleanup-tag || true
          gh release create testversion Potlings-Testversion.apk \
            --title "Testversion Nr. ${{ github.run_number }}" \
            --notes "Automatisch gebaute Testversion. Datei Potlings-Testversion.apk auf dem Android-Handy herunterladen und installieren." \
            --prerelease --target "${{ github.sha }}"
